name: Publish — Tag push

# ---------------------------------------------------------------------------
# Publish orchestrator for itl-attestation-sdk
#
# Triggered by a tag push — created automatically by ci.yml (auto-tag job).
# No GH_PAT required: GITHUB_TOKEN is used throughout.
#
# Tag routing:
#   vX.Y.Z               → PyPI      (stable, environment: pypi)
#   vX.Y.Z-{alpha|rc|…}  → TestPyPI  (pre-release, environment: testpypi)
#
# Authentication: PyPI Trusted Publisher (OIDC) — no API tokens.
# ---------------------------------------------------------------------------
on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:

  resolve-version:
    name: Resolve release version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.ver.outputs.version }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
    steps:
      - name: Extract version from tag
        id: ver
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *"-"* ]]; then
            echo "prerelease=true"  >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  publish-pypi:
    name: Publish to PyPI
    needs: resolve-version
    if: needs.resolve-version.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # OIDC Trusted Publisher
      actions: read     # download artifact from ci.yml run
    steps:
      - name: Download wheel artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: ci.yml
          commit: ${{ github.sha }}
          name: sdk-wheel
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-testpypi:
    name: Publish to TestPyPI (pre-release)
    needs: resolve-version
    if: needs.resolve-version.outputs.prerelease == 'true'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write   # OIDC Trusted Publisher
      actions: read     # download artifact from ci.yml run
    steps:
      - name: Download wheel artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: ci.yml
          commit: ${{ github.sha }}
          name: sdk-wheel
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

